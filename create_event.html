<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event - TechEvents</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/create_event.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">Tech<span>Events</span></a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="create_event.html" class="active">Create Event</a></li>
                <li><a href="manage_events.html">Manage Events</a></li>
                <li><a href="admin_dashboard.html">Admin</a></li>
            </ul>

            <div class="nav-actions">
                <a href="login.html" class="btn btn-outline">Log in</a>
                <a href="register.html" class="btn btn-primary">Sign up</a>
            </div>
        </div>
    </nav>

    <div class="page">
        <div class="container">
            <h1 class="page-title">Create New Event</h1>

            <div class="event-form-box">
                <h2>Event Details</h2>

                <form id="createEventForm">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" placeholder="Enter event title" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" placeholder="Enter event description" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="start_date">Start Date</label>
                            <input type="datetime-local" id="start_date" name="start_date" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="end_date">End Date</label>
                            <input type="datetime-local" id="end_date" name="end_date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="Enter event location" required>
                    </div>

                    <div class="form-group">
                        <label for="capacity">Capacity</label>
                        <input type="number" id="capacity" name="capacity" placeholder="Maximum capacity is 2" value="2" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Price</label>
                        <input type="number" id="price" name="price" placeholder="Enter price" required>
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="">Select event status</option>
                            <option value="draft">Draft</option>
                            <option value="confirmed">Confirmed </option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="image">Image Upload (Optional)</label>
                        <input type="file" id="image" name="image">
                    </div>

                    <div class="form-actions">  
                        <button type="reset" class="btn btn-outline" id="resetBtn">Reset</button>
                        <button type="submit" class="btn btn-primary">Create Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>TechEvents UTAS — connecting students with the tech community.</p>
        </div>
        <div class="footer-bottom">
            <div class="container">
                © 2025 TechEvents UTAS. All rights reserved.
            </div>
        </div>
    </footer>

<script src="js/create_event.js"></script>
</body>
</html>
