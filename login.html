<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <title>Login | TechEvents UTAS</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/login_style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">Tech<span>Events</span></a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="create_event.html">Create Event</a></li>
                <li><a href="manage_events.html">Manage Events</a></li>
                <li><a href="admin_dashboard.html">Admin</a></li>
            </ul>

            <div class="nav-actions">
                <a href="login.html" class="btn btn-outline">Log in</a>
                <a href="register.html" class="btn btn-primary">Sign up</a>
            </div>
        </div>
    </nav>
    
  <div class="page">

    <div class="container">

      <div class="login-box">

        <div class="login-form-image">
          <img src="images/login_bg1.jpg">
        </div>

        <div class="login-form-box">

          <h2>Login</h2>


          <form id="login-form">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Email" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            <p>Don't have an account? <a href="sign_up.html">Sign Up</a></p>
          </form>
      </div>


      </div>

    </div>
  </div>

<script src="js/login_script.js"></script>
</body>
</html>
